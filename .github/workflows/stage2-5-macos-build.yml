name: Stage 3 macOS build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/stage-3-desktop-ui
    paths:
      - .github/final-stage3-ci-trigger

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JavaScript dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Full TypeScript automated test suite
        run: npm test

      - name: Frontend production build
        run: npm run build:frontend

  build-macos-arm64:
    needs: verify
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate Tauri iconset
        run: npm run tauri icon app-icon.svg

      - name: Build Apple Silicon Node sidecar
        run: npm run build:sidecar

      - name: Verify sidecar architecture and signature
        run: |
          file src-tauri/binaries/sor-keung-sidecar-aarch64-apple-darwin
          codesign --verify --verbose=2 src-tauri/binaries/sor-keung-sidecar-aarch64-apple-darwin

      - name: Build frontend for Rust context tests
        run: npm run build:frontend

      - name: Rust credential, settings and bridge tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Tauri app and DMG
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Apply Node sidecar JIT entitlement
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sor-Keung.app"
          SIDE="$APP/Contents/MacOS/sor-keung-sidecar"

          codesign --force \
            --sign - \
            --options runtime \
            --entitlements src-tauri/SidecarEntitlements.plist \
            "$SIDE"

          # Re-sign the containing bundle after changing nested code.
          codesign --force \
            --sign - \
            --options runtime \
            "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          codesign -d --entitlements :- "$SIDE" 2>/dev/null > /tmp/sor-keung-sidecar-entitlements.plist
          test "$(plutil -extract com.apple.security.cs.allow-jit raw /tmp/sor-keung-sidecar-entitlements.plist)" = "true"

          # This reproduces the physical Tahoe failure mode without using any API key.
          OUTPUT="$(printf '' | "$SIDE")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -F '"No sidecar request received."'

      - name: Rebuild DMG from JIT-signed app
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sor-Keung.app"
          DMG_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          DMG="$DMG_DIR/Sor-Keung_0.3.0_aarch64.dmg"
          STAGE="$RUNNER_TEMP/sor-keung-dmg"

          rm -rf "$STAGE"
          mkdir -p "$STAGE" "$DMG_DIR"
          ditto "$APP" "$STAGE/Sor-Keung.app"
          ln -s /Applications "$STAGE/Applications"
          rm -f "$DMG_DIR"/*.dmg

          hdiutil create \
            -volname "Sor-Keung" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG"

      - name: Verify macOS launch metadata
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sor-Keung.app"
          test "$(plutil -extract LSRequiresCarbon raw "$APP/Contents/Info.plist")" = "false"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'LSRequiresCarbon|CFBundleExecutable|CFBundleIdentifier'

      - name: Package direct-run app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sor-Keung.app \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sor-Keung.app.zip
          unzip -l src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sor-Keung.app.zip | head -30

      - name: Upload direct-run Sor-Keung app
        uses: actions/upload-artifact@v4
        with:
          name: Sor-Keung-direct-app-aarch64-apple-darwin
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sor-Keung.app.zip
          if-no-files-found: error

      - name: Upload Sor-Keung DMG
        uses: actions/upload-artifact@v4
        with:
          name: Sor-Keung-dmg-aarch64-apple-darwin
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
