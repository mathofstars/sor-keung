[package]
name = "sor-keung-desktop"
version = "0.2.5"
description = "Stage 2.5 macOS test wrapper for Sor-Keung"
authors = ["Sor-Keung contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sor_keung_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.11.6"
tauri-plugin-shell = "2.3.6"
