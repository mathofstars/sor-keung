[package]
name = "sor-keung-desktop"
version = "0.3.0"
description = "Stage 3 desktop wrapper for Sor-Keung"
authors = ["Sor-Keung contributors"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "sor_keung_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
keyring = "4.2.0"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.11.6"
tauri-plugin-shell = "2.3.6"
tauri-plugin-store = "2.4.4"
